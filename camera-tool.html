<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>카메라 놀이</title>
  <link rel="stylesheet" href="css/tokens.css?v=7">
  <link rel="stylesheet" href="css/app.css?v=64.5.13">
  <link rel="stylesheet" href="css/features/face-toy.css?v=6">
  <link rel="stylesheet" href="css/features/lookalike-play.css?v=5">
</head>
<body class="camera-tool-window-body">
  <main id="cameraToolRoot" class="camera-tool-root">
    <div class="camera-tool-loading">카메라 화면을 준비하고 있어요…</div>
  </main>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div id="modalHost" class="modal-host hidden"></div>
  <script>
  (() => {
    const params = new URLSearchParams(location.search);
    const payload = {
      type: "moaru-camera-tool-ready",
      token: params.get("token") || "",
      tool: params.get("tool") || "camera"
    };
    const notify = () => {
      try {
        if (window.opener && !window.opener.closed) window.opener.postMessage(payload, location.origin);
      } catch {}
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", notify, { once: true });
    else notify();
  })();
  </script>
</body>
</html>
