<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>미니톡</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/tokens.css?v=7">
  <link rel="stylesheet" href="css/app.css?v=20">
  <link rel="stylesheet" href="css/features/tools.css?v=18">
  <link rel="stylesheet" href="css/features/tarot.css?v=21">
  <link rel="stylesheet" href="css/features/chat-background.css?v=18">
  <link rel="stylesheet" href="css/features/game-community.css?v=18">
  <link rel="stylesheet" href="css/features/math-quest.css?v=23">
  <link rel="stylesheet" href="css/features/quest-accordion.css?v=23">
  <link rel="stylesheet" href="css/features/coin-wallet.css?v=24">
  <link rel="stylesheet" href="css/features/shopping-store.css?v=35">
  <link rel="stylesheet" href="css/features/display-clarity.css?v=35">
</head>
<body>
  <!-- 앱의 고정 뼈대. 기능 화면은 각 feature 모듈이 #viewHost에 렌더링합니다. -->
  <main id="launchView" class="launch-view">
    <section class="launch-card">
      <div class="app-mark">M</div>
      <h1>미니톡</h1>
      <p>링크로 바로 사용하는 작은 통합 메신저</p>
      <button id="openPopupBtn" class="button primary">별도 창으로 열기</button>
      <button id="openPiPBtn" class="button secondary">항상 위로 열기</button>
      <div class="launch-inline">
        <button id="openHereBtn" class="button text">현재 창</button>
        <button id="installBtn" class="button text hidden">앱 설치(선택)</button>
      </div>
      <div id="popupControls" class="popup-controls hidden">
        <button id="focusPopupBtn" class="mini-action">창 앞으로</button>
        <button id="closePopupBtn" class="mini-action danger-lite">창 닫기</button>
      </div>
      <small id="launchMessage" class="muted"></small>
    </section>
  </main>

  <section id="appShell" class="app-shell hidden" aria-label="미니톡">
    <header class="app-header">
      <button id="backBtn" class="icon-button hidden" aria-label="뒤로">‹</button>
      <div class="header-title">
        <button id="headerProfileButton" class="header-profile-button hidden" type="button" aria-label="내 프로필 설정" title="내 프로필 설정">
          <img class="header-profile-avatar" src="assets/mascot-avatar.png" alt="내 프로필">
        </button>
        <strong id="headerTitle">미니톡</strong><span id="connectionBadge" class="connection-badge">준비</span>
      </div>
      <div id="headerActions" class="header-actions"></div>
    </header>

    <section id="authHost" class="auth-host"></section>

    <section id="workspace" class="workspace hidden">
      <nav id="sideRail" class="side-rail" aria-label="주요 메뉴"></nav>
      <main id="viewHost" class="view-host"></main>
      <nav id="bottomNav" class="bottom-nav" aria-label="주요 메뉴"></nav>
    </section>
  </section>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div id="overlayHost" class="overlay-host" aria-live="assertive"></div>
  <div id="modalHost" class="modal-host hidden"></div>

  <!-- CORE: 앱 뼈대와 공통 기반 -->
  <script src="js/config.js?v=38"></script>
  <script src="js/core/namespace.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/core/store.js?v=24"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/router.js"></script>

  <!-- ADAPTERS: 외부 서비스/브라우저 기능과의 경계 -->
  <script src="js/adapters/persistence.js"></script>
  <script src="js/adapters/auth-api.js?v=32"></script>
  <script src="js/adapters/realtime.js?v=38"></script>
  <script src="js/adapters/window-mode.js?v=21"></script>
  <script src="js/adapters/mobile-immersive.js"></script>
  <script src="js/admin/session.js?v=26"></script>

  <!-- CHAT SUBMODULES: 토리 실시간-챗에서 선별 이식한 독립 기능 -->
  <script src="js/chat/emoji.js"></script>
  <script src="js/chat/linkify.js"></script>
  <script src="js/chat/attachments.js"></script>
  <script src="js/chat/qr.js"></script>
  <script src="js/chat/voice.js"></script>
  <script src="js/chat/unread.js"></script>
  <script src="js/chat/legacy-import.js?v=38"></script>
  <script src="js/chat/server-backup.js?v=32"></script>

  <!-- UI 공통 -->
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/shell.js?v=32"></script>
  <script src="js/ui/interaction-guard.js"></script>

  <!-- ECONOMY: 코인 조회와 과목별 일일 퀘스트 보상을 분리 관리 -->
  <script src="js/economy/coin-wallet.js?v=24"></script>
  <script src="js/economy/quest-reward.js?v=27"></script>
  <script src="js/shopping/store-service.js?v=33"></script>

  <!-- GAME MODULES: 점수 저장, 랭킹, 게시판, iframe 통신 -->
  <script src="js/games/score-service.js?v=18"></script>
  <script src="js/games/ranking.js?v=18"></script>
  <script src="js/games/board.js?v=18"></script>
  <script src="js/game-bridge/game-host.js?v=18"></script>

  <!-- TASK MODULES: 과제 화면에 결합되는 독립 일일 퀘스트 -->
  <script src="js/tasks/quest-accordion.js?v=21"></script>
  <script src="js/tasks/daily-quest-clock.js?v=23"></script>
  <script src="js/tasks/daily-math-quest.js?v=23"></script>
  <script src="js/tasks/daily-korean-quest.js?v=23"></script>

  <!-- FEATURES: 삭제/교체 가능한 독립 기능 -->
  <script src="js/features/auth.js?v=26"></script>
  <script src="js/features/chats.js?v=26"></script>
  <script src="js/features/games.js?v=18"></script>
  <script src="js/tarot.js?v=17"></script>
  <!-- TOOL MODULES: 각 도구의 상태와 UI를 독립적으로 관리 -->
  <script src="js/tools/notifications.js?v=17"></script>
  <script src="js/tools/timer-alarm.js?v=17"></script>
  <script src="js/tools/tarot-view.js?v=17"></script>
  <script src="js/tools/profile-editor.js?v=24"></script>
  <script src="js/tools/capture.js?v=17"></script>
  <script src="js/features/tools.js?v=24"></script>
  <script src="js/features/tasks.js?v=20"></script>
  <script src="js/features/links.js"></script>
  <script src="js/features/shopping.js?v=35"></script>
  <script src="js/features/layout.js?v=19"></script>
  <script src="js/features/settings.js?v=26"></script>
  <script src="js/features/admin.js?v=24"></script>


  <!-- BOOTSTRAP: 초기화 순서만 담당 -->
  <script src="js/app.js?v=38"></script>
</body>
</html>
