<!doctype html>
<html lang="ko" data-theme="light" data-window-mode="standalone">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/features/shopping-store.css">
  <link rel="stylesheet" href="../css/features/quest-accordion.css">
  <link rel="stylesheet" href="../css/features/display-clarity.css">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    .app-shell{display:grid;grid-template-rows:48px 1fr;width:100%;height:100%;border:0;border-radius:0}
    .app-header{display:flex;align-items:center;padding:0 14px}
    .workspace{min-height:0}.view-host,.shopping-view{height:100%;min-height:0}
    .shopping-view{display:block}.shopping-screen{display:grid;gap:10px}
    .quest-accordion{margin-top:0}
  </style>
</head>
<body>
  <section class="app-shell">
    <header class="app-header"><strong>쇼핑</strong></header>
    <section class="workspace">
      <main class="view-host">
        <section class="view utility-view shopping-view">
          <div class="card-list shopping-screen">
            <section class="shop-market-hero">
              <span class="shop-market-mark">◇</span>
              <div class="shop-market-copy"><strong>미니 상점</strong><small>모은 코인으로 원하는 상품을 골라보세요</small></div>
              <span class="shop-market-count">준비 중</span>
            </section>
            <div class="shop-product-grid is-empty">
              <section class="shop-market-empty">
                <div class="shop-empty-illustration"><span>◇</span><i>+</i></div>
                <strong>상점을 준비하고 있어요</strong>
              </section>
            </div>
            <section class="quest-accordion section-card" data-subject="math">
              <button class="quest-accordion-toggle"><span class="quest-subject-icon">123</span><span>수학 퀘스트</span></button>
            </section>
          </div>
          <button class="shop-inventory-fab"><small>보관함</small><b>2</b></button>
        </section>
      </main>
      <nav class="bottom-nav">
        <button class="nav-button active"><span>◉</span><small>대화</small></button>
        <button class="nav-button"><span>✦</span><small>도구</small></button>
        <button class="nav-button"><span>✓</span><small>과제</small></button>
        <button class="nav-button"><span>▤</span><small>쇼핑</small></button>
        <button class="nav-button"><span>⚙</span><small>설정</small></button>
      </nav>
    </section>
  </section>
</body>
</html>
